name: industrial-ops
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: industrial
      MYSQL_USER: industrial
      MYSQL_PASSWORD: industrial
      MYSQL_ROOT_PASSWORD: industrial-local-root
    ports: ["127.0.0.1:3316:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management-alpine}
    environment:
      RABBITMQ_DEFAULT_USER: industrial
      RABBITMQ_DEFAULT_PASS: industrial
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:${REDIS_PORT:-16381}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: ["vector"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["etcd-data:/etcd"]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["vector"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address :9001
    volumes: ["minio-data:/minio_data"]
  milvus:
    image: milvusdb/milvus:v2.6.0
    profiles: ["vector"]
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["127.0.0.1:19531:19530", "127.0.0.1:9092:9091"]
    volumes: ["milvus-data:/var/lib/milvus"]
    depends_on: ["etcd", "minio"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20
  backend:
    build: ./backend
    profiles: ["app"]
    environment:
      DATABASE_URL: mysql+pymysql://industrial:industrial@mysql:3306/industrial?charset=utf8mb4
      SHARD_COUNT: ${SHARD_COUNT:-96}
      DEMO_SEED: ${DEMO_SEED:-true}
      QUEUE_BACKEND: rabbitmq
      RABBITMQ_URL: amqp://industrial:industrial@rabbitmq:5672/
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-industrial.telemetry}
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_BACKEND: ${KNOWLEDGE_BACKEND:-local}
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MCP_TRANSPORT: stdio
      LLM_MODE: ${LLM_MODE:-demo}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_TRUST_ENV: ${ARK_TRUST_ENV:-false}
      ARK_EMBEDDING_MODEL: ${ARK_EMBEDDING_MODEL:-}
      ARK_EMBEDDING_API: ${ARK_EMBEDDING_API:-auto}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
  frontend:
    build: ./frontend
    profiles: ["app"]
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  mysql-data:
  rabbit-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
